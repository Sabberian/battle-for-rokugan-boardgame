services:
  rokugan:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3017:3001"
    environment:
      PORT: "3001"
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to the deployed game URL}
      PLATFORM_SECRET: ${PLATFORM_SECRET:?Set the shared platform secret}
      MATCHES_DIR: /app/data/matches
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - rokugan-matches:/app/data/matches
volumes:
  rokugan-matches:
